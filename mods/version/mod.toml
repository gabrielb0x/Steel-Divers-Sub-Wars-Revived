# Mod « version » : la version de Sub Wars Open Sourced sous le titre, pour savoir quelle construction on
# joue. Inclus dans toutes les constructions (comme les correctifs).
#
# La version vient du fichier VERSION à la racine du projet, suivie du commit quand le projet est un
# dépôt git (« + » : avec des changements pas encore enregistrés) : « v0.1 (3566be7) ». Elle s'ajoute à la
# seconde ligne sous le titre (texte [title_codeveloped], toujours affiché, version gratuite ou premium),
# après ce qu'y met un autre mod (mention-titre).

name = "Version"
description = "La version de Sub Wars Open Sourced sur l'écran titre"
always = true

[[text]]
key = "title_codeveloped"
append = "\nSub Wars Open Sourced ${sdsw_version}"
