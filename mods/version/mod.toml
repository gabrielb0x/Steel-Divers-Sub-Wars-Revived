# Mod "version": the version of Sub Wars Open Sourced under the title, to know which build one plays. Part
# of every build (like the fixes).
#
# The version comes from the VERSION file at the root of the project, followed by the number of commits when
# the project is a git repository ("+": with changes not committed yet): "v0.1.34". It goes at the end of the
# second line under the title, on the same line (text [title_codeveloped], always shown, free or premium
# version), after what another mod (title-credits) puts there: "Co-developed by VITEI INC. v0.1.34",
# "Open Sourced by gabrielb0x. v0.1.34".
#
# Both lines are in 240-pixel frames (text_00 and text_01 of layouts/mode_title_u.arc). A text wider than the
# frame minus 10 pixels is not cut: the game narrows its characters (Layout::substituteKeystrings), and the
# line no longer looks written in the same font as the other one. "Codéveloppé par VITEI INC. v0.1.34" (the
# French text) is 320 pixels wide (heisei_w5_16a): both frames take the width of the top screen, 400 pixels
# (they are centred, and so is the text). The original text (256 pixels, already a little squeezed) and that
# of title-credits fit too without being narrowed.

name = "Version"
description = "The version of Sub Wars Open Sourced on the title screen"
always = true

[[text]]
key = "title_codeveloped"
append = " ${sdsw_version}"

[[layout]]
file = "layouts/mode_title_u.arc"
pane = "text_00"
width = 400.0

[[layout]]
file = "layouts/mode_title_u.arc"
pane = "text_01"
width = 400.0
