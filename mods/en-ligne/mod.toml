# Mod « jeu en ligne » : le jeu se connecte à notre serveur (server/) au lieu des serveurs de Nintendo.
#
#   tools/mod.py build en-ligne --set server=192.0.2.10 --install
#
# Pourquoi un patch : sur 3DS, le module système « friends » se connecte aux serveurs de Nintendo et rend
# l'adresse du serveur du jeu (authentification NASC). Azahar ne l'émule pas : RequestGameAuthentication et
# GetGameAuthenticationData de frd:u y sont des fonctions vides, et le jeu attend sans fin (voir le journal
# d'Azahar). Le patch remplace les trois fonctions que la connexion du jeu utilise
# (nn::nex::JobCTRLogin, libJugemLoginClient) :
#   GetMyPrincipalId           -> l'identifiant du joueur
#   GetMyPassword              -> son mot de passe
#   GetGameAuthenticationData  -> résultat 1, HTTP 200, adresse et port de notre serveur, jeton
# et dirige les serveurs de détection de NAT de Pia (nncs1/nncs2.app.nintendowifi.net) vers le serveur.
#
# Chaque joueur reçoit à la construction un identifiant et un mot de passe aléatoires, gardés dans
# ~/.config/sub-wars-open-sourced/identites.json (un par serveur) : le serveur l'enregistre à la première
# connexion (le jeton contient la clé Kerberos dérivée du mot de passe). Détails : docs/online.md.

name = "Jeu en ligne"
description = "Jouer en ligne sur un serveur Sub Wars Open Sourced (server/), dans Azahar"
versions = ["v0", "v5200"]

[params.server]
help = "adresse IP ou nom du serveur (31 caractères au plus)"
default = "127.0.0.1"
max_length = 31

[params.port]
help = "port UDP du serveur d'authentification (royaume « emulateur » : 61000)"
default = "61000"

[identity]
scope = "${server}:${port}"

# Adresses du code, par version du jeu (la mise à jour v5200 : mêmes fonctions de frd et de NEX, ailleurs).
[symbols]
host_text = { v0 = 0x002AF4F8, v5200 = 0x002C9734 }      # adresse du serveur (dans GetServiceLocatorData)
token_text = { v0 = 0x002AF56C, v5200 = 0x002C97A8 }     # jeton (dans RequestServiceLocator)
host_utf16 = { v0 = 0x002AF690, v5200 = 0x002C9874 }     # adresse du serveur en UTF-16 (RequestGameAuthentication)
wcslen = { v0 = 0x0023C598, v5200 = 0x00252010 }
convertUTF16toUTF8 = { v0 = 0x0023B380, v5200 = 0x00250D2C }
amxSysSetGlobal = { v0 = 0x002539C4, v5200 = 0x00269F64 }
amxSysSetGlobalArray = { v0 = 0x001DA344, v5200 = 0x001E9E78 }
session_globals = { v0 = 0x0038E660, v5200 = 0x003B5668 } # ce que retient MyNotificationEventHandler
owner_field = { v0 = 0x18, v5200 = 0x1C }                 # nouveau propriétaire, dans session_globals
# Dans les scripts : joinSession, juste après inetSetAttribute(3, somme de version)
join_hook_internet = { v0 = 0xB8F0, v5200 = 0xA564 }      # mode_internet_menu
join_hook_result = { v0 = 0xCD88, v5200 = 0x12100 }       # mode_peri_result

# -- nn::friends::CTR::detail::GetMyPrincipalId (108 octets) --------------------------------------
[[code]]
address = { v0 = 0x0021BD34, v5200 = 0x00222740 }
expect = "30402de914d04de2"
max_size = 108
arm = """
    ldr r0, pid
    bx lr
pid:
    .word ${pid}
"""

# -- nn::friends::CTR::detail::GetMyPassword(char buffer[32]) (120 octets) -------------------------
[[code]]
address = { v0 = 0x002AF2C0, v5200 = 0x002C9224 }
expect = "70402de90050a0e1"
max_size = 120
arm = """
    adr r1, password
copy:
    ldrb r2, [r1], #1
    strb r2, [r0], #1
    cmp r2, #0
    bne copy
    mov r0, #0
    bx lr
password:
    .asciz "${password}"
"""

# -- nn::friends::CTR::detail::GetGameAuthenticationData(GameAuthenticationData*) (116 octets) ------
# Structure de 0x138 octets (taille du tampon IPC 0x4E0002) : +0 résultat, +4 code HTTP, +8 adresse
# (32 octets), +0x28 port, +0x30 jeton (256 octets), +0x130 heure du serveur.
[[code]]
address = { v0 = 0x0020E3CC, v5200 = 0x002226CC }
expect = "70402de90050a0e1"
max_size = 116
arm = """
    push {r4, lr}
    mov r4, r0
    mov r1, #0
    mov r2, #0x138
clear:
    subs r2, r2, #4
    str r1, [r4, r2]
    bne clear
    mov r1, #1
    str r1, [r4]
    mov r1, #200
    str r1, [r4, #4]
    ldr r1, port
    strh r1, [r4, #0x28]
    add r0, r4, #8
    ldr r1, host
    bl strcopy
    add r0, r4, #0x30
    ldr r1, token
    bl strcopy
    mov r0, #0
    pop {r4, pc}
strcopy:
    ldrb r2, [r1], #1
    strb r2, [r0], #1
    cmp r2, #0
    bne strcopy
    bx lr
port:
    .word ${port}
host:
    .word ${host_text}
token:
    .word ${token_text}
"""

# -- Données, dans trois fonctions que le patch rend inutiles (0x002AF4F0-0x002AF798) ----------------
# Chacune commence par « rendre une erreur », au cas où le jeu l'appellerait encore (seules les étapes de
# nn::nex::JobCTRLogin les appellent, et elles ne le font plus quand GetGameAuthenticationData réussit).
[[code]]
address = { v0 = 0x002AF4F0, v5200 = 0x002C972C }   # GetServiceLocatorData
expect = "70402de90050a0e1"
arm = "mvn r0, #0\nbx lr"

[[code]]
address = "${host_text}"                  # adresse du serveur
ascii = "${server}"
max_size = 108

[[code]]
address = { v0 = 0x002AF564, v5200 = 0x002C97A0 }   # RequestServiceLocator
expect = { v0 = "ff4f2de90cd04de2", v5200 = "f04f2de90cd04de2" }
arm = "mvn r0, #0\nbx lr"

[[code]]
address = "${token_text}"                 # jeton d'authentification
ascii = "${token}"
max_size = { v0 = 284, v5200 = 196 }

[[code]]
address = { v0 = 0x002AF688, v5200 = 0x002C986C }   # RequestGameAuthentication
expect = "f84f2de90050a0e1"
arm = "mvn r0, #0\nbx lr"

[[code]]
address = "${host_utf16}"                 # nom du serveur de NAT, en UTF-16
utf16 = "${server}"
max_size = { v0 = 264, v5200 = 180 }

# -- Serveurs de détection de NAT : nncs1 et nncs2 -> notre serveur ----------------------------------
# Pointeurs lus par Pia (NatTraverser::updateNatServerAddress) et la table de NEX. Le Pia de la v5200 lit des
# noms en ASCII (sa table, 0x003D8018) : il reçoit l'adresse du serveur en ASCII.
[[code]]
address = { v0 = 0x003B0940, v5200 = 0x003D8018 }   # Pia
expect = { v0 = "8e343800c4343800", v5200 = "b1963a00cc963a00" }
words = { v0 = ["${host_utf16}", "${host_utf16}"], v5200 = ["${host_text}", "${host_text}"] }

[[code]]
address = { v0 = 0x00399E90, v5200 = 0x003C13E4 }   # NEX
expect = { v0 = "8e343800c4343800", v5200 = "d4a83a000aa93a00" }
words = ["${host_utf16}", "${host_utf16}"]

# -- Messages du serveur : MyNotificationEventHandler::ProcessNotificationEvent (568 octets) -----------
# Le jeu ne retient que trois notifications (3001 un joueur arrive, 4xxx nouveau propriétaire, 109xxx
# salon supprimé) ; le reste de la fonction n'écrivait que des journaux retirés de la version finale.
# Réécrite : les mêmes trois, plus les nôtres, qui règlent des variables de script (globales du jeu) :
#   999001  texte = nom, param1 = valeur entière       -> amxSysSetGlobal(nom, valeur)
#   999002  texte = « nom=valeur », une chaîne (UTF-8) -> amxSysSetGlobalArray(nom, 96 cellules)
# Le serveur règle ainsi les parties contre des bots (server.bots.*, les noms des bots…) ; un jeu sans ce
# mod ignore ces types.
[[code]]
address = { v0 = 0x00185264, v5200 = 0x0018A7B8 }
expect = "30402de987df4de2"
max_size = 568
arm = """
    push {r4, r5, r6, lr}
    sub sp, sp, #0x210
    mov r4, r1                  @ NotificationEvent: +0xc type, +0x10 param1, +0x14 param2, +0x1c texte
    ldr r0, [r4, #0xc]
    ldr r5, globals
    ldr r1, joined
    cmp r0, r1
    moveq r2, #0
    streq r2, [r5, #4]          @ 3001 : un joueur arrive
    beq done
    sub r1, r0, #4000
    cmp r1, #1000
    ldrlo r2, [r4, #0x14]
    strlo r2, [r5, #${owner_field}]   @ 4xxx : nouveau propriétaire (param2)
    blo done
    ldr r1, unregistered
    sub r1, r0, r1
    cmp r1, #1000
    ldrlo r2, [r4, #0x10]
    strlo r2, [r5, #4]          @ 109xxx : salon supprimé (param1)
    blo done
    ldr r1, set_global
    sub r1, r0, r1
    cmp r1, #2
    bhs done
    ldr r6, [r4, #0x1c]         @ nn::nex::String : texte UTF-16
    cmp r6, #0
    beq done
    mov r5, r1                  @ 0 : entier, 1 : chaîne
    mov r0, r6
    bl ${wcslen}
    add r1, r6, r0, lsl #1
    add r1, r1, #2              @ fin, après le zéro final
    str r6, [sp, #4]
    add r0, sp, #0x10
    str r0, [sp, #8]
    add r3, r0, #0x7f           @ 127 octets au plus
    mov r12, #1
    str r12, [sp]
    add r0, sp, #4
    add r2, sp, #8
    bl ${convertUTF16toUTF8}    @ (&texte, fin, &utf8, fin utf8, 1)
    add r0, sp, #0x10           @ seulement les variables du serveur (server.*) : ni la sauvegarde, ni le jeu
    adr r1, prefix
    mov r2, #7
prefix_loop:
    ldrb r3, [r0], #1
    ldrb r12, [r1], #1
    cmp r3, r12
    bne done
    subs r2, r2, #1
    bne prefix_loop
    cmp r5, #0
    bne string_global
    add r0, sp, #0x10
    ldr r1, [r4, #0x10]
    bl ${amxSysSetGlobal}       @ (nom, valeur)
    b done
string_global:
    add r0, sp, #0x10
find_equal:
    ldrb r1, [r0], #1
    cmp r1, #0
    beq done                    @ pas de « = » : ignoré
    cmp r1, #0x3d
    bne find_equal
    mov r1, #0
    strb r1, [r0, #-1]          @ fin du nom ; r0 : la valeur
    add r2, sp, #0x90
    mov r3, #96
    mov r12, #1
cells:
    mov r1, #0
    cmp r12, #0
    beq store
    ldrb r1, [r0], #1
    cmp r1, #0
    moveq r12, #0
store:
    str r1, [r2], #4
    subs r3, r3, #1
    bne cells
    mov r1, #0
    str r1, [sp, #0x20c]        @ dernière cellule : fin de chaîne
    add r0, sp, #0x10
    add r1, sp, #0x90
    mov r2, #96
    bl ${amxSysSetGlobalArray}  @ (nom, cellules, 96), comme sysSetGlobalString
done:
    add sp, sp, #0x210
    pop {r4, r5, r6, pc}
globals:
    .word ${session_globals}
joined:
    .word 3001
unregistered:
    .word 109000
set_global:
    .word 999001
prefix:
    .ascii "server."
"""

# -- Le serveur utilisé : un dialogue du jeu au bouton « Internet » du menu Bataille en ligne ----------------
# Le menu multijoueur (mode_multi_menu) a un état inutilisé « dialogue ouvert, OK -> mode_internet_menu »
# (sans doute l'avertissement d'une version antérieure) : le bouton Internet y passe maintenant, après
# avoir mis dans le dialogue un texte ajouté au jeu (sdsw_server, sur le modèle de internet_mode_warning,
# l'avertissement de mode_select).
[[text]]
key = "sdsw_server"
like = "internet_mode_warning"
languages = ["EU_French", "US_French"]
text = "Serveur en ligne utilisé :\n${server} (port ${port})\n\nSub Wars Open Sourced ${sdsw_version}"

[[text]]
key = "sdsw_server"
like = "internet_mode_warning"
languages = ["EU_English", "US_English", "EU_German", "EU_Italian", "EU_Spanish", "US_Spanish", "JP_Japanese"]
text = "Online server in use:\n${server} (port ${port})\n\nSub Wars Open Sourced ${sdsw_version}"

[[amx]]
file = "amx/mode_multi_menu.amx"        # update<Top>, bouton Internet, après sysEulaConfirm()
asm.v0 = """
.hook 0x96a8
    push.c "sdsw_server"
    push.c 4
    call 0x4aac                     ; dialogSetMessage
    push.c 0
    call 0x40a4                     ; dialogOpenConfirm
    const.pri 3
    stor.pri g_0000                 ; state 3: OK -> sysSetMode("mode_internet_menu")
    jump 0x96cc
"""
# La v5200 n'a plus cet état inutilisé (ses états : 1 l'offre de la version complète, 2 Dialog, 3 Top) : le
# dialogue s'ouvre dans l'état Dialog du jeu, et quand il se ferme (passage à Top dans update<Dialog>), on va au
# menu Internet comme le faisait le bouton.
asm.v5200 = """
.var $sdsw_internet
.hook 0xa4b4
    push.c "sdsw_server"
    push.c 4
    call 0x5530                     ; dialogSetMessage
    push.c 0
    call 0x4888                     ; dialogConfirmWindowIn
    const.pri 2
    stor.pri g_0000                 ; state Dialog
    const.pri 1
    stor.pri $sdsw_internet
    jump 0xa4d8

.hook 0x603c                        ; update<Dialog>, the window closed: const.pri 3 (then stor.pri g_0000: Top)
    load.pri $sdsw_internet
    jzer @sdsw_menu
    zero $sdsw_internet
    push.c "mode_internet_menu"
    push.c 4
    call 0x01a8                     ; sysSetMode
    zero g_a92c                     ; leave the mode's loop, as the button does
sdsw_menu:
    .original                       ; PRI = 3 for the stor.pri g_0000 after the hook
    .return
"""

# -- Parties contre les bots du serveur (bots_*.pasm, assembleur Pawn de tools/amxasm.py) -------------
# Seul dans une partie depuis bots_delay secondes (server/serveur.toml), le joueur reçoit server.bots.* :
# les bots rejoignent le salon un par un, comme des joueurs (nom, sous-marin, niveau), le compte à
# rebours part, la bataille commence avec les équipes demandées (format 4v4, 1v4…, carte, durée), et
# elle se termine quand une équipe n'a plus ni joueur ni bot à flot, ou à la fin du temps. En bataille,
# les bots ont la coque d'un vrai sous-marin, des couleurs, leur nom et leur niveau (pas « CPU »), et
# comptent dans les compteurs d'équipe. Leurs sous-marins : ceux des bots du jeu, avec la forme de
# collision des sous-marins des joueurs (bxml/pscope_ply01).
[[bxml]]
file = "bxml/surface_sub_bot_blue.bxml"
from = "bxml/surface_sub_npc_blue.bxml"
select = "collshape"
copy = { file = "bxml/pscope_ply01.bxml", select = "collshape" }

[[bxml]]
file = "bxml/surface_sub_bot_red.bxml"
from = "bxml/surface_sub_npc_red.bxml"
select = "collshape"
copy = { file = "bxml/pscope_ply01.bxml", select = "collshape" }

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/hud.amx"
asm_file = "bots_hud.pasm"
[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/mode_lobby.amx"
asm_file = "bots_salon.pasm"

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/mode_periscope.amx"
asm_file = "bots_bataille.pasm"

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/game_state.amx"
asm_file = "bots_partie.pasm"

# Les sous-marins pilotés par l'ordinateur des parties en ligne (bots du serveur, et ceux que le jeu ajoute pour
# compléter les équipes) jouent comme des joueurs : physique et caractéristiques d'un sous-marin de joueur,
# collisions avec la carte et les autres sous-marins, combat contre tout ennemi (joueurs et bots), visée
# là où sera la cible, torpilles à tête chercheuse, esquive, masqueur et repli quand la coque est basse.
# Écrits en Pawn (src/*.p), compilés en assembleur par tools/pawn2pasm.py ; les .pasm sont générés.
[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/surface_sub.amx"
asm_file = "bots_ia.pasm"

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/surface_torpedo.amx"
asm_file = "bots_torpille.pasm"

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/surface_torpedo_p_homing.amx"
asm_file = "bots_torpille_tc.pasm"

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/pscope_player.amx"
asm_file = "bots_joueur.pasm"

# -- Anti-triche (anti_triche_*.pasm), quand le serveur n'autorise pas la triche (server.anticheat) --------
# Chaque console surveille son propre sous-marin en bataille : dégâts annulés sans raison du jeu,
# torpilles qui ne baissent pas, tirs trop rapprochés, vitesse qu'aucun sous-marin n'a. Au premier signe, elle
# quitte la bataille (comme le bouton « quitter » du jeu) et garde ce renvoi dans la sauvegarde
# (save.sdsw.cheat : ce qu'elle a vu, save.sdsw.kick : son numéro) ; à chaque recherche de partie, elle le dit
# au serveur (attribut 4 de la recherche), qui traite chaque renvoi une fois : avec les tricheurs ou tenu à
# l'écart pendant anticheat_ban minutes (serveur.toml). Un jeu dont on a retiré ce mod échappe à la
# surveillance : c'est la limite de tout anti-triche dans un jeu en P2P.
[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/pscope_player.amx"
asm_file = "anti_triche_joueur.pasm"

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/periscope_move.amx"
asm_file = "anti_triche_tir.pasm"

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/mode_internet_menu.amx"     # joinSession, après inetSetAttribute(3, somme de version)
asm = """
.hook ${join_hook_internet}
    push.c 0
    call @acReport
    .original
    .return

; acReport(): attribute 4 of the search: 0x100 (this game watches itself) | what it caught at its last kick
; (save.sdsw.cheat, bits 0-7) | the number of that kick (save.sdsw.kick, bits 16-30); see anti_triche_tir.pasm.
acReport:
    proc
    push.c "save.sdsw.kick"
    sysreq.n sysGetGlobal, 1
    shl.c.pri 16
    push.pri
    push.c "save.sdsw.cheat"
    sysreq.n sysGetGlobal, 1
    const.alt 0xff
    and
    pop.alt
    or
    const.alt 0x100
    or
    push.pri
    push.c 4
    sysreq.n inetSetAttribute, 2
    zero.pri
    retn
"""

[[amx]]
versions = ["v0"]                       # v5200 : à porter (adresses des scripts)
file = "amx/mode_peri_result.amx"       # joinSession (« continuer en ligne »), au même endroit
asm = """
.hook ${join_hook_result}
    push.c 0
    call @acReport
    .original
    .return

; acReport(): attribute 4 of the search: 0x100 (this game watches itself) | what it caught at its last kick
; (save.sdsw.cheat, bits 0-7) | the number of that kick (save.sdsw.kick, bits 16-30); see anti_triche_tir.pasm.
acReport:
    proc
    push.c "save.sdsw.kick"
    sysreq.n sysGetGlobal, 1
    shl.c.pri 16
    push.pri
    push.c "save.sdsw.cheat"
    sysreq.n sysGetGlobal, 1
    const.alt 0xff
    and
    pop.alt
    or
    const.alt 0x100
    or
    push.pri
    push.c 4
    sysreq.n inetSetAttribute, 2
    zero.pri
    retn
"""
