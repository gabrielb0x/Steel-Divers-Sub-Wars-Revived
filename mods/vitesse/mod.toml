# Mod « vitesse » : votre sous-marin va 2, 3, 5, 10 ou 15 fois plus vite, en surface et en plongée.
#
#   tools/mod.py build vitesse --set facteur=5 --install
#   tools/mod.py build premium triche vitesse --set facteur=10 --install
#
# Comment le jeu fait avancer votre sous-marin (pscope_player, à chaque image) : la manette des gaz
# (de -1 à 1) multipliée par l'accélération s'ajoute à la vitesse dans l'axe du sous-marin, puis le
# frottement en retire linDrag (3,8 %) : la vitesse maximale vaut accélération × 25 environ. Cette
# accélération vient des notes « vitesse en surface » et « vitesse en plongée » de chaque sous-marin
# (1 à 10, bonus d'équipage compris), traduites par deux tables : bxml/table_above_accel (0,36 à 0,54)
# et bxml/table_below_accel (0,30 à 0,48), que seuls les scripts du joueur lisent (loadSubmarineProps).
# Le mod multiplie ces deux tables : vitesse maximale et marche arrière multipliées par le facteur,
# atteintes dans le même temps qu'avant. Le virage et la vitesse de plongée ne changent pas, les autres
# sous-marins non plus.
#
# Le jeu a un garde-fou : au-delà de 400 unités par image (20 au carré), il ramène la vitesse à 20. Même
# à 15 fois, la vitesse maximale (205 au plus) reste en dessous.
#
# En ligne : le jeton le dit au serveur (drapeau « triche »).

name = "Vitesse du sous-marin"
description = "Votre sous-marin va 2, 3, 5, 10 ou 15 fois plus vite ; en ligne, compté comme triche"
token_flags = ["triche"]

[params.facteur]
help = "vitesse du sous-marin : 2, 3, 5, 10 ou 15 fois plus vite"
default = "2"
choices = ["2", "3", "5", "10", "15"]

[[bxml]]
file = "bxml/table_above_accel.bxml"     # en surface : aboveAccel_1 à aboveAccel_10
scale = "${facteur}"

[[bxml]]
file = "bxml/table_below_accel.bxml"     # en plongée : belowAccel_1 à belowAccel_10
scale = "${facteur}"
