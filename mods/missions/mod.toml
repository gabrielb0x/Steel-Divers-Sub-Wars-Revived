# Mod "all missions": the 21 missions of the single-player mode can be played at once.
#
#   tools/mod.py build missions --install
#
# Nothing is written to the save: your medals and best times stay yours, and removing the mod puts the menu
# back as it was.
#
# How the missions menu decides (amx/mode_mission_select.amx, decomp/scripts/mode_mission_select.p):
# * for each of the 7 areas, it counts the missions completed (save.single.stageS.medal[L] > 0);
# * mission L of an area opens when the L-1 before it are completed;
# * an area opens when the total of missions completed reaches its threshold (0, 0, 5, 7, 12, 5, 9);
# * in the free version, only the first two areas of the menu start (otherwise it offers the full
#   version: "g_7de8 <= 1 || isFullVersion()").
# The mod counts each mission as completed (this count only opens missions and gives the total shown at the
# top of the menu, which therefore says 21), and opens every area in the free version. The medals shown stay
# those of the save.
#
# No effect online: the missions menu is local only.
#
# Update v5200: the script is recompiled (other addresses), with the same logic and the same thresholds for
# the 7 areas; both functions match instruction for instruction.

name = "All missions"
description = "The 21 single-player missions playable at once, without touching the save"
versions = ["v0", "v5200"]

[[amx]]
file = "amx/mode_mission_select.amx"
address = { v0 = 0x6A50, v5200 = 0x7314 }   # jsgeq L_6a64: "if (0 < medal) completed++"
operand = 0
expect = 0x14                             # relative jump to 0x6A64 (no medal: not counted)
value = 8                                 # to the next instruction: always counted

[[amx]]
file = "amx/mode_mission_select.amx"
address = { v0 = 0x76A0, v5200 = 0x7FA8 }   # const.alt 1 of "g_7de8 <= 1" (two areas in the free version)
operand = 0
expect = 1
value = 6                                 # the 7 areas of the menu (0 to 6)
