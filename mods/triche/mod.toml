# Mod « triche » : les tricheries que les développeurs utilisaient pour tester, sur votre sous-marin.
#
#   tools/mod.py build triche --install                           # hors ligne
#   tools/mod.py build en-ligne triche --set server=... --install # en ligne, avec le mod en-ligne
#
# Toutes sont actives par défaut ; --set <option>=non en retire une. En ligne, le jeton du mod dit au
# serveur que la triche est installée : selon sa configuration (cheats dans server/serveur.toml), vous ne
# jouez qu'avec d'autres tricheurs, avec tout le monde, ou pas du tout.
#
# D'où viennent-elles :
# * « player.muteki » (muteki : invincible) est le drapeau du mode test des développeurs (mode_test) :
#   le sous-marin ne prend plus de dégâts (pscope_player @eventDamageTorp, @eventMessageExplosionHit),
#   ne perd plus de torpilles (periscope_move fireTorpedo) et garde son air (func_16010). Rien ne
#   l'active en jeu normal : le patch remplace, dans les scripts concernés, la chaîne lue par
#   sysGetGlobal("player.muteki") par « mode.ready », qui vaut 1 pendant toute la bataille.
# * les caractéristiques des 23 sous-marins (bxml/pscope_plyNN_stats.bxml) : temps de rechargement des
#   torpilles, cadence de tir, air consommé par le masqueur, accélérations et virage (notes de 1 à 9).
# * « rafale » : plus aucun délai entre deux tirs, une torpille à chaque appui sur A (ou ZR). Le tir part
#   au relâchement du bouton (periscope_move func_11750) si le délai g_4ffc est écoulé et si le bouton de
#   tir de l'écran tactile a fini son animation ; après un tir, g_4ffc = torpedo.interval + 15 images.
#   Le mod met la cadence (torpedoFireInterval) à 1 image, retire les 15 images et n'attend plus
#   l'animation du bouton. Avec « torpilles », le stock ne baisse jamais.
#
# Mise à jour v5200 : les scripts sont recompilés (adresses différentes) avec la même logique ; pscope_player y
# lit aussi player.muteki pour la mine flottante (@p_MineExplosionHit), d'où quatre chaînes au lieu de trois.
# Les caractéristiques valent pour ses 39 sous-marins.

name = "Triche"
description = "Invincible, torpilles et air infinis, tir sans délai, masqueur gratuit, moteur gonflé"
versions = ["v0", "v5200"]
token_flags = ["triche"]

[params.invincible]
help = "aucun dégât (oui/non)"
default = "oui"

[params.torpilles]
help = "torpilles infinies (oui/non)"
default = "oui"

[params.air]
help = "air infini (oui/non)"
default = "oui"

[params.rechargement]
help = "rechargement et tir rapides (oui/non)"
default = "oui"

[params.rafale]
help = "tirer sans aucun délai, autant de torpilles qu'on veut (oui/non)"
default = "oui"

[params.masqueur]
help = "le masqueur ne consomme plus d'air (oui/non)"
default = "oui"

[params.moteur]
help = "accélération et virage au maximum (oui/non)"
default = "oui"

# -- invincible -------------------------------------------------------------------------------------
[[amx]]
if = "${invincible}"
file = "amx/pscope_player.amx"          # dégâts des torpilles, des explosions (et des mines flottantes, v5200)
string = "player.muteki"
replace = "mode.ready"
count = { v0 = 3, v5200 = 4 }

[[amx]]
if = "${invincible}"
file = "amx/hud.amx"                    # flash rouge des dégâts
string = "player.muteki"
replace = "mode.ready"
count = 1

[[amx]]
if = "${invincible}"
file = "amx/periscope_move.amx"         # @missile_hit : secousse et dégâts des missiles
at = { v0 = 0x864C, v5200 = 0xCE74 }
string = "player.muteki"
replace = "mode.ready"

# -- torpilles infinies -----------------------------------------------------------------------------
[[amx]]
if = "${torpilles}"
file = "amx/periscope_move.amx"         # fireTorpedo : ne décompte plus la torpille tirée
at = { v0 = 0x5D4C, v5200 = 0xA3DC }
string = "player.muteki"
replace = "mode.ready"

# -- air infini -------------------------------------------------------------------------------------
[[amx]]
if = "${air}"
file = "amx/periscope_move.amx"         # func_16010 : air remis à 100
at = { v0 = 0x8F84, v5200 = 0xD7F8 }
string = "player.muteki"
replace = "mode.ready"

# -- caractéristiques des 23 sous-marins du joueur (pscope_ply01 à 23_stats) -------------------------
[[bxml]]
if = "${rechargement}"
files = "bxml/pscope_ply[0-9][0-9]_stats.bxml"
set = { torpedoReplenishTime = "1", torpedoFireInterval = "30" }

[[bxml]]
if = "${rafale}"                        # après « rechargement » : c'est cette valeur qui reste
files = "bxml/pscope_ply[0-9][0-9]_stats.bxml"
set = { torpedoFireInterval = "1" }     # le minimum : à 0, le bouton de tir ne se réactive plus

[[amx]]
if = "${rafale}"
file = "amx/periscope_move.amx"         # func_10e04 : g_4ffc = torpedo.interval + 15 après un tir
address = { v0 = 0x11248, v5200 = 0x15424 }   # add.c 15
operand = 0
expect = 0xF
value = 0

[[amx]]
if = "${rafale}"
file = "amx/periscope_move.amx"         # func_11750 : « if (!g_4ffc && func_4900(tpd_00)) » (bouton prêt)
address = { v0 = 0x11780, v5200 = 0x159A0 }   # jzer L_11798
operand = 0
expect = 0x18
value = 8                               # vers l'instruction suivante : le bouton n'est plus attendu

[[bxml]]
if = "${masqueur}"
files = "bxml/pscope_ply[0-9][0-9]_stats.bxml"
set = { maskerUseAir = "0.0" }

[[bxml]]
if = "${moteur}"
files = "bxml/pscope_ply[0-9][0-9]_stats.bxml"
set = { aboveAccel = "9", belowAccel = "9", maxTurn = "8" }
