# Mod "premium": the full version of the game and all its submarines, without the eShop.
#
#   tools/mod.py build premium --install
#   tools/mod.py build online premium --set server=... --install     # with online play
#
# Sub Wars was free; the full version ("premium": all the missions, submarines, crew and patterns) and five
# historical submarines were sold on the eShop, closed since 2023. All this content is already in the base
# game, except the prows of the historical submarines (see below): the purchase only added an "add-on
# content" (title 0004008C000D7E00) whose presence the game checked.
#
# How the game checks it (source/sys/dlc.cpp, docs/premium.md): NsubShop::updateCondition asks the nn::ec
# library for the list of purchased contents and makes a 128-bit bitmap of it; checkPaidForFullVer reads
# content 91 there (the full version), checkCondition(n) content n (1 to 5: submarines 19 to 23). The scripts
# call these two functions through the natives sysDLCCheckPaidForFullVer and sysDLCCheckCondition.
#
# The update v5200 sells more: 10 more submarines (27 to 36, contents 6 to 15, their prow in the add-on
# content too) and a "refit" of each submarine (save.sub.typeN.expanded, content N + 30). updateCondition
# keeps a second bitmap there, "owned" (read by the new native sysDLCCheckOwned, NsubShop 0x0030B988); the
# submarines unlock in four more arrays (save.sub.unlock2[36] and save.p3.sub.unlock[3] for the 39
# submarines, save.sub.owned[36], save.p3.sub.owned[3]) and the crew of submarines 37 to 39 in
# save.p3.sub.crew.unlock[8]. The mod buys and owns everything there.
#
# Options:
#   unlock  (yes): also unlocks every submarine, pattern and crew member in the save, as if they had been
#                  won in missions (this stays after the mod is removed)
#   dlc     (no):  "yes" only if you installed your own DLC in Azahar (bought before the eShop closed): the
#                  submarines sold separately then keep their real models

name = "Premium"
description = "Full version (premium) and every submarine unlocked, without the eShop"
versions = ["v0", "v5200"]
token_flags = ["premium"]                 # told to the online server; this is not cheating

[params.unlock]
help = "also unlock every submarine, pattern and crew member (yes/no)"
default = "yes"

[params.dlc]
help = "yes if your own DLC is installed in Azahar: original models of the submarines sold separately (yes/no)"
default = "no"

[symbols]
SetGlobalArray = { v0 = 0x001DA344, v5200 = 0x001E9E78 }   # amxSysSetGlobalArray(name, cells, count)

# -- NsubShop::checkPaidForFullVer: the full version is bought ----------------------------------------
# Called by the native sysDLCCheckPaidForFullVer, which comes right before it and falls through into it
# (0x002F1EE4, v5200 0x0030D05C).
[[code]]
address = { v0 = 0x002F1EF4, v5200 = 0x0030D06C }
expect = { v0 = "a80f90e5020310e2", v5200 = "0b0b80e26e0f80e2" }
max_size = 16
arm = """
    mov r0, #1
    bx lr
"""

# -- NsubShop::checkCondition(index) (44 bytes): every add-on content is bought -------------------------
# Preceded by the native sysDLCCheckCondition (0x0013A054, v5200 0x0013A964), which falls into it too.
[[code]]
address = { v0 = 0x0013A06C, v5200 = 0x0013A97C }
expect = "10402de90040a0e1"
max_size = 44
arm = """
    mov r0, #1
    bx lr
"""

# -- v5200: the function of NsubShop that sysDLCCheckOwned reads (48 bytes): every content is owned ----
[[code]]
versions = ["v5200"]
address = 0x0030B988
expect = "10402de90040a0e1"
max_size = 48
arm = """
    mov r0, #1
    bx lr
"""

# -- NsubShop::updateCondition -> unlock everything ---------------------------------------------------
# The bitmap of purchases it filled is no longer used (the functions above no longer read it). The scripts
# call it at the title screen, at start-up (right after the save is loaded) and before the lobby and the
# hangar: it sets to 1 the unlock arrays of the save, which are script globals (amxSysSetGlobalArray, as the
# native sysSetGlobalArray):
#   save.sub.unlock[23]          submarines (rewards of the gold medals and missions)
#   save.sub.pattern.unlock[32]  patterns ("decal")
#   save.sub.crew.unlock[32]     crew members
# and in v5200 also save.sub.unlock2[36], save.p3.sub.unlock[3], save.sub.owned[36], save.p3.sub.owned[3] and
# save.p3.sub.crew.unlock[8] (392 bytes in v0, 536 in v5200).
[[code]]
if = "${unlock}"
address = { v0 = 0x0013A098, v5200 = 0x0013A9B0 }
expect = { v0 = "f0472de90040a0e3", v5200 = "f04f2de9022a80e2" }
max_size = { v0 = 392, v5200 = 536 }
arm.v0 = """
    push {r4, lr}
    sub sp, sp, #0x80
    mov r0, #1
    mov r1, #0
fill:
    str r0, [sp, r1, lsl #2]
    add r1, r1, #1
    cmp r1, #32
    blt fill
    adr r0, subs
    mov r1, sp
    mov r2, #23
    bl ${SetGlobalArray}
    adr r0, patterns
    mov r1, sp
    mov r2, #32
    bl ${SetGlobalArray}
    adr r0, crew
    mov r1, sp
    mov r2, #32
    bl ${SetGlobalArray}
    add sp, sp, #0x80
    mov r0, #1
    pop {r4, pc}
subs:
    .asciz "save.sub.unlock"
patterns:
    .asciz "save.sub.pattern.unlock"
crew:
    .asciz "save.sub.crew.unlock"
"""
arm.v5200 = """
    push {r4, r5, r6, lr}
    sub sp, sp, #0x90
    mov r0, #1
    mov r1, #0
fill:
    str r0, [sp, r1, lsl #2]
    add r1, r1, #1
    cmp r1, #36
    blt fill
    adr r4, arrays                      @ (name, count) pairs, then 0
next:
    ldr r0, [r4], #4
    cmp r0, #0
    beq done
    ldr r2, [r4], #4
    mov r1, sp
    bl ${SetGlobalArray}
    b next
done:
    add sp, sp, #0x90
    mov r0, #1
    pop {r4, r5, r6, pc}
arrays:
    .word subs, 23, subs2, 36, p3subs, 3, owned, 36, p3owned, 3, patterns, 32, crew, 32, p3crew, 8, 0
subs:
    .asciz "save.sub.unlock"
subs2:
    .asciz "save.sub.unlock2"
p3subs:
    .asciz "save.p3.sub.unlock"
owned:
    .asciz "save.sub.owned"
p3owned:
    .asciz "save.p3.sub.owned"
patterns:
    .asciz "save.sub.pattern.unlock"
crew:
    .asciz "save.sub.crew.unlock"
p3crew:
    .asciz "save.p3.sub.crew.unlock"
"""

# -- Submarines sold separately (19 to 23; v5200: also 27 to 36) without the DLC -----------------------
# Their hull (n2ply_x00N, "modelship") is in the base game (or in the update): it is what the other players
# see online and what the hangar shows. Only their prow, the detailed model seen by its own pilot
# (model_mutable_dlc = n2ply_x00N_prow), was in the DLC, loaded from the archive "content:" mounted by
# <mount_dlc_arc content_index="n"/> (Actor::readProperties). Without the DLC, the pilot sees the prow of a
# game submarine of the same size (n2ply_s/m/l..._prow: small, medium, large). Showing the whole hull in its
# place put the pilot's camera inside it (the huge Z class hid the whole view) and the colours of the
# patterns did not show on it: the game puts them on the "prow_mat" material of the prows.
[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply19.bxml"           # Type VII, content 1
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_m000_prow" }

[[bxml]]
