# -- Bouton « Boutique » du menu : l'eShop est fermé -------------------------------------------------
# En version complète, il ouvre mode_shop, qui attend l'eShop dans des boucles sans fin (connexion func_9910,
# sysDLCWaitThread). Il ne servait qu'à acheter les sous-marins historiques : il recharge désormais le menu
# (sysSetMode("mode_shop") devient sysSetMode("mode_select")). La v5200 propose aussi la boutique dans une
# invitation (« boutique d'essai », gIsTrialShopPrompt de dialog.inc) : elle mène au menu de même.
[[amx]]
file = "amx/mode_select.amx"
address = { v0 = 0xAEBC, v5200 = 0xB150 }   # push.c 'mode_shop', argument de sysSetMode
operand = 0
expect = { v0 = 0xA578, v5200 = 0xB5CC }
value = { v0 = 0xA50C, v5200 = 0xB4D4 }     # 'mode_select'

[[amx]]
versions = ["v5200"]
file = "amx/mode_select.amx"
address = 0x5DA4                          # push.c 'mode_shop' de l'invitation à la boutique
operand = 0
expect = 0x4F24
value = 0xB4D4                            # 'mode_select'

# -- Le drapeau « premium » de la sauvegarde n'est plus écrit ----------------------------------------
# Au titre, la première fois que la version complète est là, le jeu écrit save.sub.enlist = 1 (func_5e50).
# Ensuite, si ce drapeau est dans la sauvegarde mais que la version complète a disparu, Start affiche
# l'erreur 098-0101 et la partie ne démarre plus (g_10c98, sysShowErrEULA(98101)) : retirer le mod
# bloquerait le jeu. On l'écrit donc dans une globale « mode. », que la sauvegarde ne garde pas (seules
# les globales « save* » sont enregistrées, n_sysSaveDataSave). Une sauvegarde déjà marquée se répare avec
# tools/save.py premium-off.
[[amx]]
file = "amx/mode_title.amx"
at = { v0 = 0x36C0, v5200 = 0x3C74 }     # sysSetGlobal("save.sub.enlist", 1) de func_5e50 (v5200 : func_6864)
string = "save.sub.enlist"
replace = "mode.sub.enlist"

# -- Les couleurs des motifs -------------------------------------------------------------------------------
# Quand une récompense débloque un motif, le jeu lui donne ses couleurs par défaut (bxml/sub_color_set). Les
# motifs débloqués par ce mod n'en avaient pas (0, 0, 0) : une fois par sauvegarde (save.sdsw.colors), au titre,
# ceux dont les trois couleurs sont encore à 0 reçoivent celles du jeu (src/couleurs.p ; tools/pawn2pasm.py,
# --version v5200 pour la mise à jour).
[[amx]]
if = "${debloquer}"
file = "amx/mode_title.amx"
asm_file = { v0 = "couleurs.pasm", v5200 = "couleurs-v5200.pasm" }

# La v5200 resynchronise à chaque démarrage les récompenses avec le niveau en ligne du joueur (mode_title,
# func_103e4) : celles au-dessus de son niveau sont reverrouillées, et un motif reverrouillé reprend ses couleurs
# par défaut (en fait 0, 0, 0 : elles ne sont pas encore lues). Le mod les redéverrouille ensuite (sysDLCUpdate-
# Condition, avant le hangar), si bien que les couleurs choisies par le joueur pour les motifs 6 à 31 étaient
# perdues à chaque démarrage. Avec « debloquer », une récompense n'est plus jamais reverrouillée : func_10358
# (débloquer ou verrouiller une récompense : un motif, ou un sous-marin) ne fait plus que débloquer.
[[amx]]
versions = ["v5200"]
if = "${debloquer}"
file = "amx/mode_title.amx"
asm = """
.hook 0x1035c                       ; func_10358(reward[], lock): lock = 0
    zero.s 0x10
    .original
    .return
"""
