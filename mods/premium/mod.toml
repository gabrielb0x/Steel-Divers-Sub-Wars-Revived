# Mod « premium » : la version complète du jeu et ses 23 sous-marins, sans l'eShop.
#
#   tools/mod.py build premium --install
#   tools/mod.py build en-ligne premium --set server=... --install     # avec le jeu en ligne
#
# Sub Wars était gratuit ; la version complète (« premium » : toutes les missions, les sous-marins, l'équipage,
# les motifs) et cinq sous-marins historiques se vendaient sur l'eShop, fermé depuis 2023. Tout ce contenu est
# déjà dans le jeu de base, sauf les proues des sous-marins historiques (voir plus bas) : l'achat ne faisait
# qu'ajouter un « contenu additionnel » (titre 0004008C000D7E00) dont le jeu vérifiait la présence.
#
# Comment le jeu le vérifie (source/sys/dlc.cpp, docs/premium.md) : NsubShop::updateCondition demande à la
# bibliothèque nn::ec la liste des contenus achetés et en fait un bitmap de 128 bits ; checkPaidForFullVer y lit
# le contenu 91 (la version complète), checkCondition(n) le contenu n (1 à 5 : les sous-marins 19 à 23). Les
# scripts appellent ces deux fonctions par les natives sysDLCCheckPaidForFullVer et sysDLCCheckCondition.
#
# Options :
#   debloquer  (oui) : débloque aussi tous les sous-marins, motifs et membres d'équipage dans la sauvegarde,
#                      comme si on les avait gagnés en mission (ça reste après avoir retiré le mod)
#   dlc        (non) : « oui » seulement si vous avez installé dans Azahar votre propre DLC (acheté avant la
#                      fermeture de l'eShop) : les sous-marins historiques gardent alors leurs vrais modèles

name = "Premium"
description = "Version complète (premium) et les 23 sous-marins débloqués, sans l'eShop"
versions = ["v0"]
token_flags = ["premium"]                 # dit au serveur en ligne ; ce n'est pas de la triche

[params.debloquer]
help = "débloquer aussi tous les sous-marins, motifs et membres d'équipage (oui/non)"
default = "oui"

[params.dlc]
help = "oui si votre propre DLC est installé dans Azahar : modèles d'origine des sous-marins 19 à 23 (oui/non)"
default = "non"

# -- NsubShop::checkPaidForFullVer (16 octets) : la version complète est achetée ---------------------
# Appelée par la native sysDLCCheckPaidForFullVer, qui la précède et y tombe directement (0x002F1EE4).
[[code]]
address = 0x002F1EF4
expect = "a80f90e5020310e2"
max_size = 16
arm = """
    mov r0, #1
    bx lr
"""

# -- NsubShop::checkCondition(index) (44 octets) : chaque contenu additionnel est acheté ---------------
# Précédée de la native sysDLCCheckCondition (0x0013A054), qui y tombe aussi.
[[code]]
address = 0x0013A06C
expect = "10402de90040a0e1"
max_size = 44
arm = """
    mov r0, #1
    bx lr
"""

# -- NsubShop::updateCondition (392 octets) -> tout débloquer ----------------------------------------
# Le bitmap des achats qu'elle remplissait ne sert plus (les deux fonctions ci-dessus ne le lisent plus).
# Les scripts l'appellent au titre, au démarrage (juste après le chargement de la sauvegarde) et avant le
# salon et le hangar : on y met à 1 les tableaux de déblocage de la sauvegarde, qui sont des globales des
# scripts (amxSysSetGlobalArray, comme la native sysSetGlobalArray) :
#   save.sub.unlock[23]          sous-marins (récompenses des médailles d'or et des missions)
#   save.sub.pattern.unlock[32]  motifs (« decal »)
#   save.sub.crew.unlock[32]     membres d'équipage
[[code]]
if = "${debloquer}"
address = 0x0013A098
expect = "f0472de90040a0e3"
max_size = 392
arm = """
    push {r4, lr}
    sub sp, sp, #0x80
    mov r0, #1
    mov r1, #0
fill:
    str r0, [sp, r1, lsl #2]
    add r1, r1, #1
    cmp r1, #32
    blt fill
    adr r0, subs
    mov r1, sp
    mov r2, #23
    bl 0x001DA344
    adr r0, patterns
    mov r1, sp
    mov r2, #32
    bl 0x001DA344
    adr r0, crew
    mov r1, sp
    mov r2, #32
    bl 0x001DA344
    add sp, sp, #0x80
    mov r0, #1
    pop {r4, pc}
subs:
    .asciz "save.sub.unlock"
patterns:
    .asciz "save.sub.pattern.unlock"
crew:
    .asciz "save.sub.crew.unlock"
"""

# -- Sous-marins historiques (19 à 23) sans le DLC ---------------------------------------------------
# Leur coque (n2ply_x00N, « modelship ») est dans le jeu de base : c'est elle que les autres joueurs voient
# en ligne et que montre le hangar. Seule leur proue, le modèle détaillé vu par son propre pilote
# (model_mutable_dlc = n2ply_x00N_prow), était dans le DLC, chargée depuis l'archive « content: » montée par
# <mount_dlc_arc content_index="n"/> (Actor::readProperties). Sans le DLC, le pilote voit donc la coque.
[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply19.bxml"           # Type VII, contenu 1
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_x002" }

[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply20.bxml"           # HMS X1, contenu 2
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_x004" }

[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply21.bxml"           # I-400, contenu 3
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_x001" }

[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply22.bxml"           # classe Gato, contenu 4
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_x003" }

[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply23.bxml"           # Surcouf, contenu 5
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_x005" }

[[bxml]]
unless = "${dlc}"
files = "bxml/pscope_ply2[0-3].bxml"
select = "mount_dlc_arc"
remove = true

[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply19.bxml"
select = "mount_dlc_arc"
remove = true

# -- Bouton « Boutique » du menu : l'eShop est fermé -------------------------------------------------
# En version complète, il ouvre mode_shop, qui attend l'eShop dans des boucles sans fin (connexion func_9910,
# sysDLCWaitThread). Il ne servait qu'à acheter les sous-marins historiques : il recharge désormais le menu
# (sysSetMode("mode_shop") devient sysSetMode("mode_select")).
[[amx]]
file = "amx/mode_select.amx"
address = 0xAEBC                          # push.c 'mode_shop', argument de sysSetMode
operand = 0
expect = 0xA578
value = 0xA50C                            # 'mode_select'

# -- Le drapeau « premium » de la sauvegarde n'est plus écrit ----------------------------------------
# Au titre, la première fois que la version complète est là, le jeu écrit save.sub.enlist = 1 (func_5e50).
# Ensuite, si ce drapeau est dans la sauvegarde mais que la version complète a disparu, Start affiche
# l'erreur 098-0101 et la partie ne démarre plus (g_10c98, sysShowErrEULA(98101)) : retirer le mod
# bloquerait le jeu. On l'écrit donc dans une globale « mode. », que la sauvegarde ne garde pas (seules
# les globales « save* » sont enregistrées, n_sysSaveDataSave). Une sauvegarde déjà marquée se répare avec
# tools/save.py premium-off.
[[amx]]
file = "amx/mode_title.amx"
at = 0x36C0                               # sysSetGlobal("save.sub.enlist", 1) de func_5e50
string = "save.sub.enlist"
replace = "mode.sub.enlist"
