# Mod « premium » : la version complète du jeu et tous ses sous-marins, sans l'eShop.
#
#   tools/mod.py build premium --install
#   tools/mod.py build en-ligne premium --set server=... --install     # avec le jeu en ligne
#
# Sub Wars était gratuit ; la version complète (« premium » : toutes les missions, les sous-marins, l'équipage,
# les motifs) et cinq sous-marins historiques se vendaient sur l'eShop, fermé depuis 2023. Tout ce contenu est
# déjà dans le jeu de base, sauf les proues des sous-marins historiques (voir plus bas) : l'achat ne faisait
# qu'ajouter un « contenu additionnel » (titre 0004008C000D7E00) dont le jeu vérifiait la présence.
#
# Comment le jeu le vérifie (source/sys/dlc.cpp, docs/premium.md) : NsubShop::updateCondition demande à la
# bibliothèque nn::ec la liste des contenus achetés et en fait un bitmap de 128 bits ; checkPaidForFullVer y lit
# le contenu 91 (la version complète), checkCondition(n) le contenu n (1 à 5 : les sous-marins 19 à 23). Les
# scripts appellent ces deux fonctions par les natives sysDLCCheckPaidForFullVer et sysDLCCheckCondition.
#
# La mise à jour v5200 vend davantage : 10 sous-marins de plus (27 à 36, contenus 6 à 15, leur proue aussi
# dans le contenu additionnel) et un « remodelage » de chaque sous-marin (save.sub.typeN.expanded, contenu
# N + 30). updateCondition y tient un second bitmap, « possédé » (lu par la nouvelle native sysDLCCheckOwned,
# NsubShop 0x0030B988) ; les sous-marins se débloquent dans quatre tableaux de plus (save.sub.unlock2[36] et
# save.p3.sub.unlock[3] pour les 39 sous-marins, save.sub.owned[36], save.p3.sub.owned[3]) et l'équipage des
# sous-marins 37 à 39 dans save.p3.sub.crew.unlock[8]. Le mod y fait tout acheter et tout posséder.
#
# Options :
#   debloquer  (oui) : débloque aussi tous les sous-marins, motifs et membres d'équipage dans la sauvegarde,
#                      comme si on les avait gagnés en mission (ça reste après avoir retiré le mod)
#   dlc        (non) : « oui » seulement si vous avez installé dans Azahar votre propre DLC (acheté avant la
#                      fermeture de l'eShop) : les sous-marins vendus à part gardent alors leurs vrais modèles

name = "Premium"
description = "Version complète (premium) et tous les sous-marins débloqués, sans l'eShop"
versions = ["v0", "v5200"]
token_flags = ["premium"]                 # dit au serveur en ligne ; ce n'est pas de la triche

[params.debloquer]
help = "débloquer aussi tous les sous-marins, motifs et membres d'équipage (oui/non)"
default = "oui"

[params.dlc]
help = "oui si votre propre DLC est installé dans Azahar : modèles d'origine des sous-marins vendus à part (oui/non)"
default = "non"

[symbols]
SetGlobalArray = { v0 = 0x001DA344, v5200 = 0x001E9E78 }   # amxSysSetGlobalArray(name, cells, count)

# -- NsubShop::checkPaidForFullVer : la version complète est achetée ----------------------------------
# Appelée par la native sysDLCCheckPaidForFullVer, qui la précède et y tombe directement (0x002F1EE4, v5200
# 0x0030D05C).
[[code]]
address = { v0 = 0x002F1EF4, v5200 = 0x0030D06C }
expect = { v0 = "a80f90e5020310e2", v5200 = "0b0b80e26e0f80e2" }
max_size = 16
arm = """
    mov r0, #1
    bx lr
"""

# -- NsubShop::checkCondition(index) (44 octets) : chaque contenu additionnel est acheté ---------------
# Précédée de la native sysDLCCheckCondition (0x0013A054, v5200 0x0013A964), qui y tombe aussi.
[[code]]
address = { v0 = 0x0013A06C, v5200 = 0x0013A97C }
expect = "10402de90040a0e1"
max_size = 44
arm = """
    mov r0, #1
    bx lr
"""

# -- v5200 : la fonction de NsubShop que lit sysDLCCheckOwned (48 octets) : chaque contenu est possédé ---
[[code]]
versions = ["v5200"]
address = 0x0030B988
expect = "10402de90040a0e1"
max_size = 48
arm = """
    mov r0, #1
    bx lr
"""

# -- NsubShop::updateCondition -> tout débloquer -----------------------------------------------------
# Le bitmap des achats qu'elle remplissait ne sert plus (les fonctions ci-dessus ne le lisent plus).
# Les scripts l'appellent au titre, au démarrage (juste après le chargement de la sauvegarde) et avant le
# salon et le hangar : on y met à 1 les tableaux de déblocage de la sauvegarde, qui sont des globales des
# scripts (amxSysSetGlobalArray, comme la native sysSetGlobalArray) :
#   save.sub.unlock[23]          sous-marins (récompenses des médailles d'or et des missions)
#   save.sub.pattern.unlock[32]  motifs (« decal »)
#   save.sub.crew.unlock[32]     membres d'équipage
# et dans la v5200 aussi save.sub.unlock2[36], save.p3.sub.unlock[3], save.sub.owned[36],
# save.p3.sub.owned[3] et save.p3.sub.crew.unlock[8] (392 octets en v0, 536 en v5200).
[[code]]
if = "${debloquer}"
address = { v0 = 0x0013A098, v5200 = 0x0013A9B0 }
expect = { v0 = "f0472de90040a0e3", v5200 = "f04f2de9022a80e2" }
max_size = { v0 = 392, v5200 = 536 }
arm.v0 = """
    push {r4, lr}
    sub sp, sp, #0x80
    mov r0, #1
    mov r1, #0
fill:
    str r0, [sp, r1, lsl #2]
    add r1, r1, #1
    cmp r1, #32
    blt fill
    adr r0, subs
    mov r1, sp
    mov r2, #23
    bl ${SetGlobalArray}
    adr r0, patterns
    mov r1, sp
    mov r2, #32
    bl ${SetGlobalArray}
    adr r0, crew
    mov r1, sp
    mov r2, #32
    bl ${SetGlobalArray}
    add sp, sp, #0x80
    mov r0, #1
    pop {r4, pc}
subs:
    .asciz "save.sub.unlock"
patterns:
    .asciz "save.sub.pattern.unlock"
crew:
    .asciz "save.sub.crew.unlock"
"""
arm.v5200 = """
    push {r4, r5, r6, lr}
    sub sp, sp, #0x90
    mov r0, #1
    mov r1, #0
fill:
    str r0, [sp, r1, lsl #2]
    add r1, r1, #1
    cmp r1, #36
    blt fill
    adr r4, arrays                      @ (name, count) pairs, then 0
next:
    ldr r0, [r4], #4
    cmp r0, #0
    beq done
    ldr r2, [r4], #4
    mov r1, sp
    bl ${SetGlobalArray}
    b next
done:
    add sp, sp, #0x90
    mov r0, #1
    pop {r4, r5, r6, pc}
arrays:
    .word subs, 23, subs2, 36, p3subs, 3, owned, 36, p3owned, 3, patterns, 32, crew, 32, p3crew, 8, 0
subs:
    .asciz "save.sub.unlock"
subs2:
    .asciz "save.sub.unlock2"
p3subs:
    .asciz "save.p3.sub.unlock"
owned:
    .asciz "save.sub.owned"
p3owned:
    .asciz "save.p3.sub.owned"
patterns:
    .asciz "save.sub.pattern.unlock"
crew:
    .asciz "save.sub.crew.unlock"
p3crew:
    .asciz "save.p3.sub.crew.unlock"
"""

# -- Sous-marins vendus à part (19 à 23 ; v5200 : aussi 27 à 36) sans le DLC ---------------------------
# Leur coque (n2ply_x00N, « modelship ») est dans le jeu de base (ou dans la mise à jour) : c'est elle que les
# autres joueurs voient en ligne et que montre le hangar. Seule leur proue, le modèle détaillé vu par son propre
# pilote (model_mutable_dlc = n2ply_x00N_prow), était dans le DLC, chargée depuis l'archive « content: » montée
# par <mount_dlc_arc content_index="n"/> (Actor::readProperties). Sans le DLC, le pilote voit la proue d'un
# sous-marin du jeu de même taille (n2ply_s/m/l…_prow : petit, moyen, grand). Montrer la coque entière à sa
# place mettait la caméra du pilote dedans (la classe Z, immense, cachait toute la vue) et les couleurs des
# motifs ne s'y voyaient pas : le jeu les pose sur le matériau « prow_mat » des proues.
[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply19.bxml"           # Type VII, contenu 1
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_m000_prow" }

[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply20.bxml"           # HMS X1, contenu 2
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_l002_prow" }

[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply21.bxml"           # I-400, contenu 3
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_l001_prow" }

[[bxml]]
unless = "${dlc}"
file = "bxml/pscope_ply22.bxml"           # classe Gato, contenu 4
rename = { model_mutable_dlc = "model_mutable" }
set = { model_mutable = "n2ply_m003_prow" }

[[bxml]]
