# -- The menu's "Shop" button: the eShop is closed ---------------------------------------------------
# In the full version it opens mode_shop, which waits for the eShop in endless loops (connection func_9910,
# sysDLCWaitThread). It only served to buy the historical submarines: it now reloads the menu
# (sysSetMode("mode_shop") becomes sysSetMode("mode_select")). The v5200 also offers the shop in an
# invitation ("trial shop", gIsTrialShopPrompt of dialog.inc): it leads to the menu as well.
[[amx]]
file = "amx/mode_select.amx"
address = { v0 = 0xAEBC, v5200 = 0xB150 }   # push.c 'mode_shop', argument of sysSetMode
operand = 0
expect = { v0 = 0xA578, v5200 = 0xB5CC }
value = { v0 = 0xA50C, v5200 = 0xB4D4 }     # 'mode_select'

[[amx]]
versions = ["v5200"]
file = "amx/mode_select.amx"
address = 0x5DA4                          # push.c 'mode_shop' of the invitation to the shop
operand = 0
expect = 0x4F24
value = 0xB4D4                            # 'mode_select'

# -- The save's "premium" flag is no longer written --------------------------------------------------
# At the title screen, the first time the full version is there, the game writes save.sub.enlist = 1
# (func_5e50). Then, if this flag is in the save but the full version has gone, Start shows error 098-0101
# and the game no longer starts (g_10c98, sysShowErrEULA(98101)): removing the mod would lock the game. So it
# is written into a "mode." global, which the save does not keep (only "save*" globals are saved,
# n_sysSaveDataSave). A save already flagged is repaired with tools/save.py premium-off.
[[amx]]
file = "amx/mode_title.amx"
at = { v0 = 0x36C0, v5200 = 0x3C74 }     # sysSetGlobal("save.sub.enlist", 1) of func_5e50 (v5200: func_6864)
string = "save.sub.enlist"
replace = "mode.sub.enlist"

# -- The colours of the patterns ------------------------------------------------------------------------
# When a reward unlocks a pattern, the game gives it its default colours (bxml/sub_color_set). The patterns
# unlocked by this mod had none (0, 0, 0): once per save (save.sdsw.colors), at the title screen, those whose
# three colours are still 0 get the game's (src/colours.p; tools/pawn2pasm.py, --version v5200 for the
# update).
[[amx]]
if = "${unlock}"
file = "amx/mode_title.amx"
asm_file = { v0 = "colours.pasm", v5200 = "colours-v5200.pasm" }

# At each start-up the v5200 resynchronises the rewards with the player's online level (mode_title,
# func_103e4): those above their level are locked again, and a pattern locked again gets its default colours
# back (in fact 0, 0, 0: they are not read yet). The mod then unlocks them again (sysDLCUpdateCondition,
# before the hangar), so that the colours the player chose for patterns 6 to 31 were lost at every start-up.
# With "unlock", a reward is never locked again: func_10358 (unlock or lock a reward: a pattern, or a
# submarine) only unlocks.
[[amx]]
versions = ["v5200"]
if = "${unlock}"
file = "amx/mode_title.amx"
asm = """
.hook 0x1035c                       ; func_10358(reward[], lock): lock = 0
    zero.s 0x10
    .original
    .return
"""
