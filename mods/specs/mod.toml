# Mod "specs": your own characteristics of the submarines.
#
#   tools/subs.py export                              # creates your file, with the game's values
#   tools/subs.py set "Type VII" torpedoMax=10 maxTurn=9   # or edit it with a text editor
#   tools/mod.py build specs --install                # then the mod (or: build premium specs ...)
#
# The file (submarines.toml in the settings folder, "tools/subs.py --help") gives, for each of the 23
# submarines, the values of bxml/pscope_plyNN_stats.bxml: turning, speed, armour and dive ratings (1 to 10),
# torpedoes, reload, rate of fire, crew, masker... Only the values that differ from the game's are written.
# Values outside the limits the game supports are refused.
#
# With the update v5200 (39 submarines, several rebalanced), the file is submarines-v5200.toml: each version
# keeps its own, with its own starting values.
#
# Meant for offline play. Online, the mod's token tells the server (flag "specs"): it is treated as the
# cheats mod (server/server.toml, option cheats: kept apart from the other players by default).

name = "Characteristics"
description = "Your own characteristics of the submarines (tools/subs.py); counted as cheating online"
versions = ["v0", "v5200"]
token_flags = ["specs"]

[params.file]
help = "your characteristics file (\"auto\": submarines.toml of the settings folder)"
default = "auto"

[[subs]]
file = "${file}"
