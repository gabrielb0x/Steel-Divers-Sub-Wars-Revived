# Mod « musique » : vos musiques à la place de celles du jeu.
#
#   tools/music.py list                          # les musiques du jeu (titre, missions, cartes en ligne…)
#   tools/music.py set Title_lr ma-musique.wav   # ou l'onglet Musique du lanceur, qui prend aussi MP3, OGG, FLAC…
#   tools/mod.py build musique --install         # puis le mod (avec vos autres mods : build premium musique …)
#
# Vos musiques sont dans le dossier « musique » du dossier de réglages, un WAV par musique remplacée, au nom du
# flux qu'il remplace ; les retirer (tools/music.py reset --all, ou « Remettre les musiques d'origine » dans le
# lanceur) rend celles du jeu. Le mod écrit chacune en flux PCM16 (audiores/stream/*.bcstm, tools/bcstm.py), avec
# les canaux et la fréquence de l'original, en boucle depuis le début. Rien ne change en jeu ni en ligne.

name = "Musique"
description = "Vos musiques à la place de celles du jeu (onglet Musique, ou tools/music.py)"
versions = ["v0", "v5200"]

[params.dossier]
help = "dossier de vos musiques (« auto » : musique du dossier de réglages)"
default = "auto"

[[music]]
dir = "${dossier}"
