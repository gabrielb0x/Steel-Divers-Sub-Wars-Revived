# Correctifs du jeu dans Azahar, inclus dans tous les mods (tools/mod.py build <mod> les ajoute toujours,
# sauf --no-fixes). Seuls :
#
#   tools/mod.py build correctifs --install
#
# -- Plantage quand une torpille touche un sous-marin sous l'eau ----------------------------------
# Symptôme : en mission, une torpille touche un sous-marin sous l'eau et quelques instants plus tard
# Azahar se ferme. En réalité il est tué par le système, faute de mémoire (journal du noyau :
# « Out of memory: Killed process (azahar) », 5 Go de RAM et 4 Go d'échange occupés).
#
# Ce que fait le jeu : un sous-marin touché fuit de l'huile (fxOilAdd dans les scripts des sous-marins :
# une bulle toutes les 9 images, qui vit 2 secondes). MetaBallSys (source/metaball.cpp) dessine ces
# bulles sous l'eau seulement, en sprites : chaque point devient un carré grâce au geometry shader du
# programme 2 de shaders/metaball.shbin. Pour chaque point visible, ce shader fait deux boucles
# imbriquées (« loop i0 » dans main, et « loop i1 » dans le sous-programme draw_strip appelé par la
# première), d'un tour chacune : i0 = i1 = (0, 0, 1, 0).
#
# Le bug est dans Azahar (et Citra), pas dans le jeu : leur JIT de shaders x64 garde le compteur de
# boucle dans un registre de l'hôte, qu'il ne sauvegarde que pour une boucle imbriquée dans le même
# bloc de code (video_core/shader/shader_jit_x64_compiler.cpp, Compile_LOOP). Ici, la boucle interne
# est dans un sous-programme : elle écrase le compteur de la boucle externe et le laisse à 0, que la
# boucle externe décrémente à -1 avant de tester s'il est nul. Elle repart pour environ quatre
# milliards de tours, chacun émettant deux triangles qu'Azahar garde en mémoire avant de les dessiner.
# Le jeu se fige, la mémoire se remplit et le système tue l'émulateur. D'où les symptômes : seulement
# sous l'eau (l'huile n'y est dessinée que là), seulement quand une bulle est devant la caméra, et plus
# rien une vingtaine de secondes après le dernier coup (la fuite s'arrête). Le moteur de shaders sans
# JIT d'Azahar (option « Enable Shader JIT » décochée) n'a pas le bug, mais il est plus lent.
#
# Correction : les deux boucles ne font qu'un tour et n'utilisent pas leur compteur (aucun registre
# indexé par aL) ; on remplace les deux instructions LOOP par des NOP. Le shader fait exactement la
# même chose, sans boucle. tools/shbin.py --check repère ce motif : aucun autre shader du jeu ne l'a.
#
# Aucun effet sur le jeu en ligne : seul l'affichage d'un effet change, pas la partie.

name = "Correctifs"
description = "Corrige le plantage d'Azahar quand une torpille touche un sous-marin sous l'eau"
versions = ["v0", "v5200"]
always = true

[[shader]]
file = "shaders/metaball.shbin"
instruction = 0x084                       # main du programme 2 : loop i0 -> 0x086 (appelle draw_strip)
expect = 0xA4021800
value = 0x84000000                        # nop

[[shader]]
file = "shaders/metaball.shbin"
instruction = 0x061                       # draw_strip : loop i1 -> 0x06f
expect = 0xA441BC00
value = 0x84000000                        # nop
