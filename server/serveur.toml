# Configuration du serveur en ligne (python3 -m sdsw_server, depuis server/).
# Deux « royaumes » indépendants : comptes et parties séparés. Le mod en ligne d'Azahar vise le premier,
# le portage PC visera le second.

[server]
listen = "0.0.0.0"              # adresse d'écoute
public_address = "auto"         # adresse (IP ou nom) par laquelle les joueurs d'Internet joignent cette machine ;
                                # "auto" : celle que donne la box (UPnP), sinon celle que voit un serveur STUN
upnp = true                     # demander à la box d'ouvrir les ports du serveur (UPnP), tant qu'il tourne
nat_check = true                # détection du NAT de Pia : UDP 10025 et 10125 (ports fixés par le jeu)
name = "Sub Wars Open Sourced"  # nom affiché sur la page d'état
status_port = 0                 # page d'état (joueurs en ligne, parties) en HTTP sur ce port TCP ; 0 : aucune

# Options de partie, par royaume :
#   max_players  joueurs humains par partie, de 2 à 8. Le jeu complète toujours chaque équipe à 4 sous-marins
#                avec des bots (sous-marins pilotés par la console hôte) : moins d'humains, plus de bots.
#                2 = toujours un contre un, plus 3 bots de chaque côté.
#   cheats       joueurs dont le mod triche : mods/triche, ou caractéristiques de sous-marins modifiées
#                (mods/specs) ; le mod premium n'en fait pas partie.
#                "autorises" (ils jouent avec tout le monde), "separes" (seulement entre eux) ou "refuses".
# Pour bannir un joueur : son identifiant (journal du serveur : « login pid … ») sur une ligne de
# <data_dir>/bannis.txt ; le fichier est relu à chaque connexion, sans redémarrer le serveur.

[[realm]]
name = "emulateur"              # joueurs sur émulateur (mods/en-ligne)
auth_port = 61000               # serveur d'authentification (UDP)
secure_port = 61001             # serveur sécurisé (UDP)
data_dir = "data/emulateur"     # comptes (sqlite), relatif à ce fichier
max_players = 8
cheats = "separes"

[[realm]]
name = "pc"                     # joueurs du portage PC
auth_port = 61010
secure_port = 61011
data_dir = "data/pc"
max_players = 8
cheats = "separes"
